
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineVault - Inventory Manager</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <script src="{{ url_for('static', filename='script.js') }}" defer></script>

    {% block head %}{% endblock %}
</head>
<body>

    <div class="minecraft-landscape" aria-hidden="true">
        <div class="pixel-sun"></div>
        <div class="pixel-cloud cloud-one"></div>
        <div class="pixel-cloud cloud-two"></div>
        <div class="pixel-hill hill-one"></div>
        <div class="pixel-hill hill-two"></div>
        <div class="pixel-grass"></div>
    </div>

    <div class="minevault-content">
        {% block body %}{% endblock %}
    </div>

</body>
</html>
