{% extends 'base.html' %}

{% block head %}

{% endblock %}

{% block body %}
<section class="inventory-section" id="chest">

    <h2>📦 Chest Storage</h2>
    <p>Manage items stored inside your chest</p>

    <h3>{{ chest_slots[0][0] }}</h3>
    <form action="/chest-select/{{player[0]}}" method="POST">
        <input type="number" id="chest_sel" name="chest_sel" min="1" max="5">  <!-- change max to be variable -->
        <input type="submit" id="chest_sel_submit" value="Swap Chest">
    </form>

<p id="capacity-text">Storage Capacity: 18 / 27 slots</p>


    <div class="capacity-bar">

<div class="capacity-fill" id="capacity-fill"></div>

    </div>

    <div class="inventory-grid">
        {% for slot in chest_slots %}
        <div class="slot">{{slot[2]}} {{slot[3]}}</div>
        {% endfor %}
    </div>

</section>

{% endblock %}
