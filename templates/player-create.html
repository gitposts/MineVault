{% extends 'base.html' %}

{% block head %}

{% endblock %}

{% block body %}
<h2>Create a New Avatar!</h2>
<p>Enter your username, avatar name, and EXP level.</p>

<form action="/create-player" method="POST">
    <label for="username">Username:</label><br>
    <input type="text" id="username" name="username"><br>
    <label for="avatar_name">Avatar Name:</label><br>
    <input type="text" id="avatar_name" name="avatar_name"><br>
    <label for="exp">EXP Level:</label><br>
    <input type="number" id="exp" name="exp"><br>
    <input type="submit" id="submit_new_player" value="Create!">
</form>

<form action="/player-select" method="GET" >
    <button type="submit">
        Cancel
    </button>
</form>
{% endblock %}
